name: scanner_taloes
description: Leitor de talões dos Jogos Santa Casa — câmara, OCR e resultados.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.1
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/resultados.json
